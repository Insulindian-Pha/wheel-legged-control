controller_manager:
  ros__parameters:
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    vmc_controller:
      type: vmc_controller/VMCController

    lqr_controller:
      type: lqr_controller/LQRController

imu_broadcaster:
  ros__parameters:
    sensor_name: "imu_sensor"
    topic_name: "/imu/data"
    frame_id: "base_link"

vmc_controller:
  ros__parameters:
    # 关节名称配置
    left_front_joint_name: "Left_front_joint"
    left_rear_joint_name: "Left_rear_joint"
    right_front_joint_name: "Right_front_joint"
    right_rear_joint_name: "Right_rear_joint"

    # 话题配置
    imu_topic: "/imu_broadcaster/imu"
    force_command_topic: "/vmc_controller/force_command"

    # 控制参数
    max_torque: 90.0 # 最大力矩限制 (Nm)

    # VMC杆长参数 (单位: m)
    l1: 0.216280
    l2: 0.255184
    l3: 0.255184
    l4: 0.216280
    l5: 0.0

    # F0和Tp默认值
    left_F0: 0.0
    left_Tp: 0.0
    right_F0: 0.0
    right_Tp: 0.0

    # 关节初始角度偏置 (单位: rad)
    # 这些值将被加到反馈角度中，使初始角度成为0点
    left_front_joint_offset: 0.15 # 左前关节初始角度偏置
    left_rear_joint_offset: 0.0 # 左后关节初始角度偏置
    right_front_joint_offset: -0.112 # 右前关节初始角度偏置
    right_rear_joint_offset: 0.0 # 右后关节初始角度偏置

    # 关节角度取反配置（用于匹配VMC坐标系）
    # 1.0: 不取反, -1.0: 取反
    left_front_joint_invert_sign: 1.0
    left_rear_joint_invert_sign: -1.0
    right_front_joint_invert_sign: 1.0
    right_rear_joint_invert_sign: -1.0

    # Pitch轴极性配置（用于匹配VMC坐标系）
    # 1.0: 不取反, -1.0: 取反
    pitch_invert_sign: 1.0

    # 期望的默认L0
    left_desired_l0: 0.15
    right_desired_l0: 0.15

    enable_anti_split: false

    # PID参数配置
    pid_gains:
      l0_control:
        # 左腿pid
        left_leg:
          target: 0.20
          kp: -100.0
          ki: 0.0
          kd: -10.0
          u_clamp_max: 50.0
          u_clamp_min: -50.0
          i_clamp_max: 5.0
          i_separation_threshold: 0.0
        # 右腿pid
        right_leg:
          target: 0.20
          kp: 100.0
          ki: 0.0
          kd: 10.0
          u_clamp_max: 50.0
          u_clamp_min: -50.0
          i_clamp_max: 5.0
          i_separation_threshold: 0.0
      theta_control:
        left_leg:
          target: 0.0 # 期望的theta值（弧度）
          kp: -10.0
          ki: 0.0
          kd: -5.0
          u_clamp_max: 50.0
          u_clamp_min: -50.0
          i_clamp_max: 5.0
          i_separation_threshold: 0.0
        right_leg:
          target: 0.0 # 期望的theta值（弧度）
          kp: -10.0
          ki: 0.0
          kd: -5.0
          u_clamp_max: 50.0
          u_clamp_min: -50.0
          i_clamp_max: 5.0
          i_separation_threshold: 0.0
      # 防劈岔补偿：使左右腿 theta 之和趋于 0（仿 chassisR_task Tp_Pid）
      anti_split:
        target: 0.0 # 期望 left_theta + right_theta = 0
        kp: -100.0
        ki: 0.0
        kd: -30.0
        u_clamp_max: 10.0
        u_clamp_min: -10.0
        i_clamp_max: 0.0
        i_separation_threshold: 0.0

lqr_controller:
  ros__parameters:
    # 轮毂电机关节名称
    left_wheel_joint_name: "Left_Wheel_joint"
    right_wheel_joint_name: "Right_Wheel_joint"

    # 话题配置
    vmc_state_topic: "/vmc_controller/vmc_state"
    # IMU 话题：设为非空则用 IMU 提供 pitch/pitch_gyro/yaw/yaw_gyro；留空则用 VMC 与轮速积分
    imu_topic: "/imu_broadcaster/imu"
    force_command_topic: "/vmc_controller/force_command"

    # 物理参数
    wheel_radius: 0.06 # 轮半径 (m)
    max_wheel_torque: 100.0 # 最大轮毂电机力矩 (Nm)

    # 期望值
    x_set: 0.0 # 期望位置 (m)
    v_set: 0.0 # 期望速度 (m/s)

    # LQR K 矩阵配置 (4x10 = 40个值)
    # 状态向量 (10个状态):
    # 0: s (位移)
    # 1: dot_s (速度)
    # 2: fai (航向角)
    # 3: dot_fai (航向角速度)
    # 4: theta_ll (左腿角度)
    # 5: dot_theta_ll (左腿角速度)
    # 6: theta_lr (右腿角度)
    # 7: dot_theta_lr (右腿角速度)
    # 8: theta_b (身体角度)
    # 9: dot_theta_b (身体角速度)

    # LQR K 值 - 左轮力矩 (K[0:9])
    left_wheel_lqr_gains:
      0: -2.2361 # s (位移) -> 左轮力矩
      1: -3.1505 # dot_s (速度) -> 左轮力矩
      2: 0.6305 # fai (航向角) -> 左轮力矩
      3: 0.3033 # dot_fai (航向角速度) -> 左轮力矩
      4: -15.6212 # theta_ll (左腿角度) -> 左轮力矩
      5: -1.5100 # dot_theta_ll (左腿角速度) -> 左轮力矩
      6: -0.0338 # theta_lr (右腿角度) -> 左轮力矩
      7: -0.3870 # dot_theta_lr (右腿角速度) -> 左轮力矩
      8: -0.0074 # theta_b (身体角度) -> 左轮力矩
      9: -0.0013 # dot_theta_b (身体角速度) -> 左轮力矩

    # LQR K 值 - 右轮力矩 (K[10:19])
    right_wheel_lqr_gains:
      0: 2.2361 # s (位移) -> 右轮力矩
      1: 3.1505 # dot_s (速度) -> 右轮力矩
      2: 0.6305 # fai (航向角) -> 右轮力矩
      3: 0.3033 # dot_fai (航向角速度) -> 右轮力矩
      4: -0.0338 # theta_ll (左腿角度) -> 右轮力矩
      5: -0.3870 # dot_theta_ll (左腿角速度) -> 右轮力矩
      6: -15.6212 # theta_lr (右腿角度) -> 右轮力矩
      7: -1.5100 # dot_theta_lr (右腿角速度) -> 右轮力矩
      8: 0.0074 # theta_b (身体角度) -> 右轮力矩
      9: 0.0013 # dot_theta_b (身体角速度) -> 右轮力矩

    # LQR K 值 - 左腿力矩 (K[20:29])
    left_leg_lqr_gains:
      0: 0.0033 # s (位移) -> 左腿力矩
      1: 0.0046 # dot_s (速度) -> 左腿力矩
      2: -4.9601 # fai (航向角) -> 左腿力矩
      3: -1.2515 # dot_fai (航向角速度) -> 左腿力矩
      4: 6.0336 # theta_ll (左腿角度) -> 左腿力矩
      5: 0.1564 # dot_theta_ll (左腿角速度) -> 左腿力矩
      6: -6.0169 # theta_lr (右腿角度) -> 左腿力矩
      7: -0.1540 # dot_theta_lr (右腿角速度) -> 左腿力矩
      8: 5.0000 # theta_b (身体角度) -> 左腿力矩
      9: 0.7075 # dot_theta_b (身体角速度) -> 左腿力矩

    # LQR K 值 - 右腿力矩 (K[30:39])
    right_leg_lqr_gains:
      0: 0.0033 # s (位移) -> 右腿力矩
      1: 0.0046 # dot_s (速度) -> 右腿力矩
      2: 4.9601 # fai (航向角) -> 右腿力矩
      3: 1.2515 # dot_fai (航向角速度) -> 右腿力矩
      4: -6.0169 # theta_ll (左腿角度) -> 右腿力矩
      5: -0.1540 # dot_theta_ll (左腿角速度) -> 右腿力矩
      6: 6.0336 # theta_lr (右腿角度) -> 右腿力矩
      7: 0.1564 # dot_theta_lr (右腿角速度) -> 右腿力矩
      8: -5.0000 # theta_b (身体角度) -> 右腿力矩
      9: -0.7075 # dot_theta_b (身体角速度) -> 右腿力矩

    # 状态变量极性配置 (10个值, 对应10个状态量)
    # 1.0: 保持原极性, -1.0: 取反
    # 0: s (位移), 1: dot_s (速度), 2: fai (航向角), 3: dot_fai (航向角速度)
    # 4: theta_ll (左腿角度), 5: dot_theta_ll (左腿角速度)
    # 6: theta_lr (右腿角度), 7: dot_theta_lr (右腿角速度)
    # 8: theta_b (身体角度), 9: dot_theta_b (身体角速度)
    state_polarity:
      0: 1.0 # s (位移)
      1: 1.0 # dot_s (速度)
      2: 0.0 # fai (航向角)
      3: 0.0 # dot_fai (航向角速度)
      4: 1.0 # theta_ll (左腿角度)
      5: 1.0 # dot_theta_ll (左腿角速度)
      6: 1.0 # theta_lr (右腿角度)
      7: 1.0 # dot_theta_lr (右腿角速度)
      8: 1.0 # theta_b (身体角度)
      9: 1.0 # dot_theta_b (身体角速度)
