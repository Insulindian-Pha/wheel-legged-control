controller_manager:
  ros__parameters:
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_group_effort_controller:
      type: effort_controllers/JointGroupEffortController

    vmc_controller:
      type: vmc_controller/VMCController

imu_broadcaster:
  ros__parameters:
    sensor_name: "imu_sensor"
    topic_name: "/imu/data"
    frame_id: "base_link"

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["jwheel_left"]
    right_wheel_names: ["jwheel_right"]
    wheel_separation: 0.4155
    wheel_radius: 0.06
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    enable_odom_tf: true
    publish_rate: 50.0
    linear.x.max_velocity: 100.0
    linear.x.min_velocity: -100.0
    angular.z.max_velocity: 100.0
    angular.z.min_velocity: -100.0

joint_group_effort_controller:
  ros__parameters:
    joints:
      - jIJ
      - jIO
      - jwheel_left
      - jAB
      - jAG
      - jwheel_right

vmc_controller:
  ros__parameters:
    # 关节名称配置（使用 MuJoCo 中的关节名称）
    left_front_joint_name: "jIJ"
    left_rear_joint_name: "jIO"
    right_front_joint_name: "jAB"
    right_rear_joint_name: "jAG"

    # 话题配置
    imu_topic: "/imu_broadcaster/imu"
    force_command_topic: "/vmc_controller/force_command"

    # 控制参数
    max_torque: 90.0  # 最大力矩限制 (Nm)


    # VMC杆长参数 (单位: m)
    l5: 0.0  
    l1: 0.215
    l4: 0.215
    l2: 0.258
    l3: 0.258

    # F0和Tp默认值
    left_F0: 0.0
    left_Tp: 0.0
    right_F0: 0.0
    right_Tp: 0.0

    left_front_joint_offset: 0.003   # 左前关节(jIJ)初始角度偏置
    left_rear_joint_offset: -1.3    # 左后关节(jIO)初始角度偏置
    right_front_joint_offset: 0.027  # 右前关节(jAB)初始角度偏置
    right_rear_joint_offset: 1.3  # 右后关节(jAG)初始角度偏置

    # 关节角度取反配置（用于匹配VMC坐标系）
    # 1.0: 不取反, -1.0: 取反
    # 对于right_front_joint_invert_sign，已经包含了phi1计算符号的调整
    # wheel_leg_mujoco模型不需要取反，phi1使用M_PI+pos，所以符号为1.0
    left_front_joint_invert_sign: 1.0
    left_rear_joint_invert_sign: 1.0
    right_front_joint_invert_sign: 1.0  # wheel_leg_mujoco模型：轴方向(1.0)和phi1符号(1.0)，结果为1.0
    right_rear_joint_invert_sign: 1.0

    left_desired_l0: 0.15   # 期望的左腿L0（米）
    right_desired_l0: 0.15  # 期望的右腿L0（米）
    
    # PID参数配置
    pid_gains:
      l0_control:
        left_leg:
          target: 0.15
          kp: -100.0
          ki: 0.0
          kd: -10.0
          u_clamp_max: 50.0
          u_clamp_min: -50.0
          i_clamp_max: 5.0
          i_separation_threshold: 0.0

        right_leg:
          target: 0.15
          kp: 100.0
          ki: 0.0
          kd: 10.0
          u_clamp_max: 50.0
          u_clamp_min: -50.0
          i_clamp_max: 5.0
          i_separation_threshold: 0.0