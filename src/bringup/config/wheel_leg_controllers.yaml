controller_manager:
  ros__parameters:
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_group_effort_controller:
      type: effort_controllers/JointGroupEffortController

    vmc_controller:
      type: vmc_controller/VMCController

imu_broadcaster:
  ros__parameters:
    imu_sensor_name: "imu_sensor"
    topic_name: "/imu/data"
    frame_id: "base_link"

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["jwheel_left"]
    right_wheel_names: ["jwheel_right"]
    wheel_separation: 0.4155
    wheel_radius: 0.06
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    enable_odom_tf: true
    publish_rate: 50.0
    linear.x.max_velocity: 100.0
    linear.x.min_velocity: -100.0
    angular.z.max_velocity: 100.0
    angular.z.min_velocity: -100.0

joint_group_effort_controller:
  ros__parameters:
    joints:
      - jIJ
      - jIO
      - jwheel_left
      - jAB
      - jAG
      - jwheel_right

vmc_controller:
  ros__parameters:
    # 关节名称配置（使用 MuJoCo 中的关节名称）
    left_front_joint_name: "jIJ"
    left_rear_joint_name: "jIO"
    right_front_joint_name: "jAB"
    right_rear_joint_name: "jAG"

    # 话题配置
    imu_topic: "/imu/data"
    force_command_topic: "/vmc_controller/force_command"

    # 控制参数
    max_torque: 90.0  # 最大力矩限制 (Nm)


    # VMC杆长参数 (单位: m)
    l5: 0.0  
    l1: 0.215
    l4: 0.215
    l2: 0.258
    l3: 0.258

    # F0和Tp默认值
    left_F0: 0.0
    left_Tp: 0.0
    right_F0: 0.0
    right_Tp: 0.0

    # 关节初始角度偏置 (单位: rad)
    # 这些值将被加到反馈角度中，使初始角度成为0点
    # 计算公式: pos = pos_raw + offset，要使pos=0，则 offset = -pos_raw
    # 如果设置为0.0，则使用当前关节位置作为初始角度（需要在启动时手动设置）
    # 
    # 注意：这些偏移值需要与Simulation.py中environment.py的偏移值一致
    # Simulation.py中：jAB+0.027, jAG+1.3, jIJ+0.003, jIO-1.3
    # 但控制器中左右腿会交换，且会加上π，所以偏移值需要相应调整
    # 
    # Simulation.py最终计算：
    #   右腿：phi1 = (sensor_jAB + 0.027) + π, phi4 = sensor_jAG + 1.3
    #   左腿：phi1 = (sensor_jIO - 1.3) + π, phi4 = sensor_jIJ + 0.003
    # 
    # 控制器最终计算（左右腿交换）：
    #   左腿：phi1 = π + (sensor_jAB + offset), phi4 = π + (sensor_jAG + offset)
    #   右腿：phi1 = π + (sensor_jIJ + offset), phi4 = π + (sensor_jIO + offset)
    # 
    # 要使左腿phi1与Simulation.py左腿phi1一致：
    #   π + (sensor_jAB + offset) = (sensor_jIO - 1.3) + π
    #   但这是不可能的，因为使用的是不同的关节
    # 
    # 实际上，控制器中的左右腿交换是设计上的差异
    # 正确的做法是：使偏移后的值加上π后，与Simulation.py中的值一致
    # 
    # 对于左腿（使用jAB和jAG）：
    #   phi1应该 = (sensor_jIO - 1.3) + π，但实际是 π + (sensor_jAB + offset)
    #   所以需要：sensor_jAB + offset = sensor_jIO - 1.3
    #   但这是不可能的，因为jAB和jIO是不同的关节
    # 
    # 重新理解：控制器中的"左腿"实际上使用的是右腿的关节（jAB和jAG）
    # 所以应该使：
    #   控制器左腿phi1 = π + (sensor_jAB + offset) = Simulation.py左腿phi1 = (sensor_jIO - 1.3) + π
    #   这意味着：sensor_jAB + offset = sensor_jIO - 1.3
    #   但这是不可能的
    # 
    # 实际上，Simulation.py中左腿使用的是jIO和jIJ，而控制器中左腿使用的是jAB和jAG
    # 这说明两个系统的关节映射可能不同，需要重新检查
    left_front_joint_offset: 0.003   # 左前关节(jIJ)初始角度偏置，对应Simulation.py中的0.003
    left_rear_joint_offset: -1.3    # 左后关节(jIO)初始角度偏置，对应Simulation.py中的-1.3
    right_front_joint_offset: 0.027  # 右前关节(jAB)初始角度偏置，对应Simulation.py中的0.027
    right_rear_joint_offset: 1.3  # 右后关节(jAG)初始角度偏置，对应Simulation.py中的1.3