controller_manager:
  ros__parameters:
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_group_effort_controller:
      type: effort_controllers/JointGroupEffortController

    vmc_controller:
      type: vmc_controller/VMCController

imu_broadcaster:
  ros__parameters:
    sensor_name: "imu_sensor"
    topic_name: "/imu/data"
    frame_id: "base_link"

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["Left_Wheel_joint"]
    right_wheel_names: ["Right_Wheel_joint"]
    wheel_separation: 0.4155
    wheel_radius: 0.06
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    enable_odom_tf: true
    publish_rate: 50.0
    linear.x.max_velocity: 100.0
    linear.x.min_velocity: -100.0
    angular.z.max_velocity: 100.0
    angular.z.min_velocity: -100.0

joint_group_effort_controller:
  ros__parameters:
    joints:
      - Left_front_joint
      - Left_rear_joint
      - Left_Wheel_joint
      - Right_front_joint
      - Right_rear_joint
      - Right_Wheel_joint

vmc_controller:
  ros__parameters:
    # 关节名称配置
    left_front_joint_name: "Left_front_joint"
    left_rear_joint_name: "Left_rear_joint"
    right_front_joint_name: "Right_front_joint"
    right_rear_joint_name: "Right_rear_joint"

    # 话题配置
    imu_topic: "/imu/data"
    force_command_topic: "/vmc_controller/force_command"

    # 控制参数
    max_torque: 90.0 # 最大力矩限制 (Nm)

    # VMC杆长参数 (单位: m)
    l1: 0.216280
    l2: 0.255184
    l3: 0.255184
    l4: 0.216280
    l5: 0.0

    # F0和Tp默认值
    left_F0: 0.0
    left_Tp: 0.0
    right_F0: 0.0
    right_Tp: 0.0

    # 关节初始角度偏置 (单位: rad)
    # 这些值将被加到反馈角度中，使初始角度成为0点
    left_front_joint_offset: 0.15 # 左前关节初始角度偏置
    left_rear_joint_offset: 0.0 # 左后关节初始角度偏置
    right_front_joint_offset: -0.112 # 右前关节初始角度偏置
    right_rear_joint_offset: 0.0 # 右后关节初始角度偏置

    # 关节角度取反配置（用于匹配VMC坐标系）
    # 1.0: 不取反, -1.0: 取反
    left_front_joint_invert_sign: 1.0
    left_rear_joint_invert_sign: -1.0
    right_front_joint_invert_sign: 1.0
    right_rear_joint_invert_sign: -1.0

    # 期望的默认L0
    left_desired_l0: 0.15
    right_desired_l0: 0.15

    # PID参数配置
    pid_gains:
      l0_control:
        # 左腿pid
        left_leg:
          target: 0.15
          kp: -100.0
          ki: 0.0
          kd: -10.0
          u_clamp_max: 50.0
          u_clamp_min: -50.0
          i_clamp_max: 5.0
          i_separation_threshold: 0.0
        # 右腿pid
        right_leg:
          target: 0.15
          kp: 100.0
          ki: 0.0
          kd: -5.0
          u_clamp_max: 50.0
          u_clamp_min: -50.0
          i_clamp_max: 5.0
          i_separation_threshold: 0.0
      theta_control:
        left_leg:
          target: 0.0 # 期望的theta值（弧度）
          kp: -10.0
          ki: 0.0
          kd: -5.0
          u_clamp_max: 50.0
          u_clamp_min: -50.0
          i_clamp_max: 5.0
          i_separation_threshold: 0.0
        right_leg:
          target: 0.0 # 期望的theta值（弧度）
          kp: -10.0
          ki: 0.0
          kd: -5.0
          u_clamp_max: 50.0
          u_clamp_min: -50.0
          i_clamp_max: 5.0
          i_separation_threshold: 0.0
